
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OxiTrack - Registro Empresa</title>

  <link rel="stylesheet" href="./css/oxitrack-base.css">
  <link rel="stylesheet" href="./css/particular.css">

  <style>
    [hidden] { display: none !important; }

    .empresa-contenedor { width: 100%; }

    .empresa-estado {
      font-size: 13px;
      color: #666;
      margin: 8px 0;
    }

    .empresa-estado:empty,
    #resultado:empty { display: none; }

    #resultado {
      margin: 12px 0;
      font-size: 14px;
      color: #611e63;
    }

    #receptor,
    #observaciones {
        text-transform: uppercase;
    }

    #receptor {
        margin-bottom: 12px;
    }

    #btnNoRealizado {
      background: #963636;
      color: white;
    }

    #btnCancelarNoRealizado {
      background: #999;
      color: white;
    }

    #firma { display: block; }

    .elemento-contador input {
      flex: 1;
      min-width: 0;
    }

    .empresa-advertencia {
      font-size: 13px;
      color: #963636;
      margin: 10px 0;
    }

    #cola:empty { display: none; }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="contenedor particular-contenedor empresa-contenedor">

    <div class="cabecera-logo">
      <img
        src="../assets/img/favicon.png"
        alt="Logo Oxilife"
        class="logo-marca"
      >
      <div class="textos-cabecera">
        <h1>OxiTrack</h1>
        <p class="subtitulo">Registro Empresa</p>
      </div>
    </div>

    <form id="formulario">

      <label for="servicio">Servicio</label>
      <select id="servicio" class="select-particular" required>
        <option value="">Cargando servicios...</option>
      </select>

      <label for="asignacion">Paciente</label>
      <select
        id="asignacion"
        class="select-particular"
        required
        disabled
      >
        <option value="">Primero seleccione un servicio...</option>
      </select>

      <input type="hidden" id="pacienteId">

      <p id="estadoConexion" class="empresa-estado"></p>
      <p id="operarioVisible" hidden></p>
      <p id="mensajeAsignaciones" hidden></p>

      <!-- Solo los contadores dependen del paciente seleccionado -->
      <div id="cantidades" class="seccion-elementos"></div>

      <label for="receptor">Nombre de quien recibe</label>
      <input
        id="receptor"
        type="text"
        autocomplete="name"
        placeholder="Persona que recibió el servicio"
      >

      <label for="observaciones">Observaciones</label>
      <textarea
        id="observaciones"
        placeholder="Observaciones del servicio..."
      ></textarea>

      <div id="seccionFotos" class="seccion-fotos">

        <div class="titulo">EVIDENCIA FOTOGRÁFICA</div>

        <p class="texto-foto">
          Tome al menos una fotografía del servicio realizado.
        </p>

        <video
          id="vistaCamara"
          autoplay
          playsinline
          hidden
        ></video>

        <div class="botones-camara">
          <button type="button" id="btnAbrirCamara">
            Abrir Cámara
          </button>

          <button type="button" id="btnTomarFoto" hidden>
            Tomar Foto
          </button>
        </div>

        <div id="previewFotos" class="preview-fotos"></div>

        <canvas id="canvasFoto" hidden></canvas>
      </div>

      <label id="tituloFirmaEmpresa" for="firma">
        Firma Cliente
      </label>

      <canvas id="firma"></canvas>

        <button type="submit" id="btnEnviar">
        Enviar Registro
        </button>

        <button type="button" id="btnNoRealizado">
            NO REALIZADO
        </button>

        <div id="avisoNoRealizado" hidden>
        <p class="empresa-advertencia">
            Indique el motivo y tome una fotografía.
            No se requiere firma.
        </p>

        <button type="button" id="btnCancelarNoRealizado">
            Volver al registro normal
        </button>
        </div>

        <button type="button" id="btnLimpiar">
            Limpiar Firma
        </button>

    </form>

    <p id="resultado" role="status" hidden></p>
    <p id="cola" hidden></p>

  </div>

  <!-- Confirmación -->
  <div id="modalConfirmacion" class="modal" hidden>
    <div class="modal-contenido">
      <h2>Confirmar Registro</h2>

      <div id="modalResumen" class="modal-resumen"></div>

      <div class="modal-acciones">
        <button
          type="button"
          id="btnModalVolver"
          class="btn-secundario"
        >
          Volver
        </button>

        <button
          type="button"
          id="btnModalConfirmar"
          class="btn-principal"
        >
          Confirmar
        </button>
      </div>
    </div>
  </div>

  <!-- Resultado -->
  <div id="modalResultado" class="modal" hidden>
    <div class="modal-contenido modal-exito">
      <h2 id="modalResultadoTitulo">Registro</h2>
      <p id="modalResultadoMensaje" class="modal-mensaje"></p>

      <button
        type="button"
        id="btnModalResultado"
        class="btn-principal"
      >
        Aceptar
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="./js/empresa.js?v=20261051-6" defer></script>
</body>
</html>
