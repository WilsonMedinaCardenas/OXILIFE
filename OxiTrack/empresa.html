
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OxiTrack | Terreno Empresa</title>
  <link rel="stylesheet" href="css/oxitrack-base.css">
  <style>
    [hidden] { display: none !important; }
    .contenedor { max-width: 450px; margin: auto; }
    .grupo { margin: 14px 0; }
    .panel { padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin: 12px 0; }
    .fila-cantidad { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px; margin: 9px 0; border: 1px solid #ddd; border-radius: 9px; }
    .cantidad-controles { display: flex; align-items: center; gap: 6px; }
    .cantidad-controles button { min-width: 38px; min-height: 38px; }
    .cantidad-controles input { width: 62px; text-align: center; }
    .boton-alerta { background: #9b2020; color: #fff; }
    .estado { font-size: .9rem; color: #555; }
    .ayuda { font-size: .85rem; color: #666; }
    select, textarea, input { max-width: 100%; }
    canvas { width: 100%; height: 170px; border: 1px solid #aaa; border-radius: 8px; background: white; touch-action: none; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <main class="contenedor">
    <div class="cabecera-logo">
      <img src="../assets/img/favicon.png" alt="Oxilife" width="54">
      <h1>OxiTrack</h1>
      <p class="subtitulo">Terreno Empresa</p>
    </div>

    <p id="estadoConexion" class="estado">Iniciando...</p>
    <p id="operarioVisible" class="estado"></p>

    <form id="formulario">
      <div class="grupo">
        <label for="servicio">Servicio</label>
        <select id="servicio" required>
          <option value="">Cargando servicios...</option>
        </select>
      </div>

      <div class="grupo">
        <label for="asignacion">Asignación pendiente</label>
        <select id="asignacion" required disabled>
          <option value="">Seleccione primero un servicio</option>
        </select>
        <p id="mensajeAsignaciones" class="ayuda"></p>
      </div>

      <section id="detalleServicio" hidden>
        <div id="ficha" class="panel"></div>
        <div id="cantidades"></div>

        <div class="grupo">
          <label for="receptor">Nombre de quien recibe</label>
          <input id="receptor" autocomplete="name" placeholder="Persona que recibió el servicio">
        </div>

        <div class="grupo">
          <label for="observaciones">Observaciones de terreno</label>
          <textarea id="observaciones" rows="3" placeholder="Indique quién recibió, condiciones de entrega o motivo del servicio no realizado"></textarea>
        </div>

        <div class="grupo">
          <label for="foto">Fotografía de respaldo</label>
          <input id="foto" type="file" accept="image/*" capture="environment">
          <p class="ayuda">Obligatoria para NO REALIZADO, implementaciones y recargas.</p>
        </div>

        <div id="zonaFirma" class="grupo">
          <label>Firma de quien recibe</label>
          <canvas id="firma"></canvas>
          <button type="button" id="limpiarFirma">Limpiar firma</button>
        </div>

        <div class="grupo">
          <button type="submit" id="enviar">Registrar ATENDIDO</button>
          <button type="button" id="noRealizado" class="boton-alerta">NO REALIZADO</button>
        </div>
      </section>
    </form>

    <p id="resultado" role="status"></p>

    <button type="button" id="sincronizar">Sincronizar pendientes</button>
    <p id="cola" class="estado"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="./js/empresa.js?v=20261020-3" defer></script>
</body>
</html>
