
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OxiTrack - Empresa</title>
  <link rel="stylesheet" href="./css/oxitrack-base.css">
  <link rel="stylesheet" href="./css/particular.css">
  <style>
    [hidden] { display: none !important; }
    .empresa-contenedor { width: 100%; }
    .empresa-estado { font-size: 12px; color: #666; margin: 0 0 8px; }
    .empresa-estado:empty { display: none; }
    #resultado { margin: 12px 0; font-size: 14px; color: #611e63; }
    #resultado:empty { display: none; }
    #receptor { margin-bottom: 12px; }
    #btnNoRealizado { background: #963636; color: white; margin-top: 14px; }
    #btnCancelarNoRealizado { background: #999; color: white; }
    #sincronizar { background: #eee; color: #333; font-size: 13px; padding: 9px; margin-top: 12px; }
    #firma { display: block; }
    .elemento-contador input { flex: 1; min-width: 0; }
    .empresa-advertencia { font-size: 13px; color: #963636; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="contenedor particular-contenedor empresa-contenedor">
    <div class="cabecera-logo">
      <img src="../assets/img/favicon.png" alt="Logo Oxilife" class="logo-marca">
      <div class="textos-cabecera">
        <h1>OxiTrack</h1>
        <p class="subtitulo">Registro Empresa</p>
      </div>
    </div>

    <form id="formulario">
      <label for="servicio">Servicio</label>
      <select id="servicio" class="select-particular" required>
        <option value="">Cargando servicios...</option>
      </select>

      <label for="asignacion">Paciente</label>
      <select id="asignacion" class="select-particular" required disabled>
        <option value="">Primero seleccione un servicio...</option>
      </select>

      <input type="hidden" id="pacienteId">
      <p id="estadoConexion" class="empresa-estado"></p>
      <p id="operarioVisible" class="empresa-estado" hidden></p>
      <p id="mensajeAsignaciones" class="empresa-estado" hidden></p>

      <div id="detalleServicio" hidden>
        <div id="cantidades"></div>

        <label for="receptor">Nombre de quien recibe</label>
        <input id="receptor" autocomplete="name" placeholder="Persona que recibió el servicio">

        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" placeholder="Observaciones del servicio..."></textarea>

        <div id="seccionFotos" class="seccion-fotos">
          <div class="titulo">EVIDENCIA FOTOGRÁFICA</div>
          <p class="texto-foto">Tome al menos una fotografía del servicio realizado.</p>
          <video id="vistaCamara" autoplay playsinline hidden></video>
          <div class="botones-camara">
            <button type="button" id="btnAbrirCamara">Abrir Cámara</button>
            <button type="button" id="btnTomarFoto" hidden>Tomar Foto</button>
          </div>
          <div id="previewFotos" class="preview-fotos"></div>
          <canvas id="canvasFoto" hidden></canvas>
        </div>

        <label id="tituloFirmaEmpresa" for="firma">Firma Cliente</label>
        <canvas id="firma"></canvas>

        <button type="button" id="btnNoRealizado">NO REALIZADO</button>

        <div id="avisoNoRealizado" hidden>
          <p class="empresa-advertencia">Registre el motivo y tome al menos una fotografía. No se requiere firma.</p>
          <button type="button" id="btnCancelarNoRealizado">Volver al registro normal</button>
        </div>

        <button type="submit" id="btnEnviar">Enviar Registro</button>
        <button type="button" id="btnLimpiar">Limpiar Firma</button>
      </div>
    </form>

    <p id="resultado" role="status"></p>
    <button type="button" id="sincronizar">Sincronizar pendientes</button>
    <p id="cola" class="empresa-estado"></p>
  </div>

  <div id="modalConfirmacion" class="modal" hidden>
    <div class="modal-contenido">
      <h2>Confirmar Registro</h2>
      <div id="modalResumen" class="modal-resumen"></div>
      <div class="modal-acciones">
        <button type="button" id="btnModalVolver" class="btn-secundario">Volver</button>
        <button type="button" id="btnModalConfirmar" class="btn-principal">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="modalResultado" class="modal" hidden>
    <div class="modal-contenido modal-exito">
      <h2 id="modalResultadoTitulo">Registro</h2>
      <p id="modalResultadoMensaje" class="modal-mensaje"></p>
      <button type="button" id="btnModalResultado" class="btn-principal">Aceptar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="./js/empresa.js?v=20261021-1" defer></script>
</body>
</html>
