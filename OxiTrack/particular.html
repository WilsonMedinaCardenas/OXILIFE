<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OxiTrack - Particular</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="contenedor particular-contenedor">

        <!-- ==================================================
             CABECERA
             ================================================== -->

        <div class="cabecera-logo">

            <img
                src="../assets/img/favicon.png"
                alt="Logo Oxilife"
                class="logo-marca"
            >

            <div class="textos-cabecera">

                <h1>OxiTrack</h1>

                <p class="subtitulo">
                    Registro Particular
                </p>

            </div>

        </div>


        <!-- ==================================================
             FORMULARIO PARTICULAR
             ================================================== -->

        <form id="formularioParticular">


            <!-- ==================================================
                 SERVICIO
                 PRIMER CAMPO PORQUE DETERMINA QUÉ HOJA CONSULTAR
                 ================================================== -->

            <label for="servicioParticular">
                Servicio
            </label>

            <select
                id="servicioParticular"
                class="select-particular"
                required
            >

                <option value="">
                    Seleccione el tipo de servicio...
                </option>

            </select>


            <!-- ==================================================
                 PACIENTE
                 SE LLENA DESPUÉS DE SELECCIONAR SERVICIO
                 ================================================== -->

            <label for="pacienteParticular">
                Paciente
            </label>

            <select
                id="pacienteParticular"
                class="select-particular"
                required
                disabled
            >

                <option value="">
                    Primero seleccione un servicio...
                </option>

            </select>


            <!-- ID INTERNO DEL REGISTRO/PACIENTE -->
            <input
                type="hidden"
                id="pacienteId"
            >
            
            <!-- ===================================================== -->
            <!-- ELEMENTOS ENTREGADOS - SOLO IMPLEMENTACIÓN -->
            <!-- ===================================================== -->

            <div id="seccionElementos" class="seccion-elementos" hidden>
                <div class="titulo">ELEMENTOS ENTREGADOS</div>
                <div id="listaElementos"></div>
            </div>

            <!-- ==================================================
                 ENTREGADOS
                 ================================================== -->
        <div id="seccionCilindros">
            <div class="titulo"> ENTREGADOS</div>


            <label>
                Cilindros 0.7 m³
            </label>

            <div class="contador">

                <button
                    type="button"
                    onclick="disminuir('e07')"
                >
                    −
                </button>

                <input
                    id="e07"
                    value="0"
                    readonly
                >

                <button
                    type="button"
                    onclick="aumentar('e07')"
                >
                    +
                </button>

            </div>


            <label>
                Cilindros 10 m³
            </label>

            <div class="contador">

                <button
                    type="button"
                    onclick="disminuir('e10')"
                >
                    −
                </button>

                <input
                    id="e10"
                    value="0"
                    readonly
                >

                <button
                    type="button"
                    onclick="aumentar('e10')"
                >
                    +
                </button>

            </div>


            <!-- ==================================================
                 RETIRADOS
                 ================================================== -->

            <div class="titulo">
                RETIRADOS
            </div>


            <label>
                Cilindros 0.7 m³
            </label>

            <div class="contador">

                <button
                    type="button"
                    onclick="disminuir('r07')"
                >
                    −
                </button>

                <input
                    id="r07"
                    value="0"
                    readonly
                >

                <button
                    type="button"
                    onclick="aumentar('r07')"
                >
                    +
                </button>

            </div>


            <label>
                Cilindros 10 m³
            </label>

            <div class="contador">

                <button
                    type="button"
                    onclick="disminuir('r10')"
                >
                    −
                </button>

                <input
                    id="r10"
                    value="0"
                    readonly
                >

                <button
                    type="button"
                    onclick="aumentar('r10')"
                >
                    +
                </button>

            </div>
        </div>


            <!-- ==================================================
                 OBSERVACIONES
                 ================================================== -->

            <label for="obs">
                Observaciones
            </label>

            <textarea
                id="obs"
                placeholder="Observaciones del servicio..."
            ></textarea>


            <!-- ==================================================
                 FOTOGRAFÍA
                 ================================================== -->

            <!-- ===================================================== -->
            <!-- CÁMARA OXITRACK -->
            <!-- IMPLEMENTACIÓN / RECARGA / VENTA -->
            <!-- OCULTA EN RETIRO -->
            <!-- ===================================================== -->

            <div id="seccionFotos" class="seccion-fotos">

                <div class="titulo">EVIDENCIA FOTOGRÁFICA</div>

                <p class="texto-foto">
                    Tome al menos una fotografía del servicio realizado.
                </p>

                <!-- Vista en vivo de la cámara -->
                <video id="vistaCamara" autoplay playsinline hidden></video>

                <!-- Botones de cámara -->
                <div class="botones-camara">
                    <button type="button" id="btnAbrirCamara">Abrir Cámara</button>
                    <button type="button" id="btnTomarFoto" hidden>Tomar Foto</button>
                </div>

                <!-- Previsualización de máximo 2 fotos -->
                <div id="previewFotos" class="preview-fotos"></div>

                <!-- Canvas interno para capturar la imagen -->
                <canvas id="canvasFoto" hidden></canvas>

            </div>


                <!-- ==================================================
                 FIRMA
                 ================================================== -->

            <label>
                Firma Cliente
            </label>

            <canvas id="firma"></canvas>


            <!-- ==================================================
                 BOTONES
                 ================================================== -->

            <button
                type="submit"
                id="btnEnviar"
            >
                Enviar Registro
            </button>


            <button
                type="button"
                id="btnLimpiar"
            >
                Limpiar Firma
            </button>

        </form>

    </div>


    <!-- SIGNATURE PAD -->
    <script
        src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"
    ></script>


    <!-- JS EXCLUSIVO PARA PARTICULARES -->
    <script src="js/particular.js"></script>

</body>

</html>
